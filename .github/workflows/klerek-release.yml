name: KLEREK KASIR - Signed APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: Signed APK & GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ekstrak Android source dari ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s KLEREK_KASIR_ANDROID_SOURCE.zip
          unzip -t KLEREK_KASIR_ANDROID_SOURCE.zip | tail -1
          unzip -q -o KLEREK_KASIR_ANDROID_SOURCE.zip -d "$GITHUB_WORKSPACE"
          test -f android/app/build.gradle
          test -f android/app/src/main/assets/web/update-config.json
      - name: Validasi versi tag dan paket
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE "s/^[[:space:]]*versionName '([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/p" android/app/build.gradle | head -1)"
          test -n "$APP_VERSION"
          test "$GITHUB_REF_NAME" = "v$APP_VERSION" || { echo "Tag harus v$APP_VERSION"; exit 1; }
      - name: Validate secrets
        shell: bash
        env:
          KLEREK_KEYSTORE_BASE64: ${{ secrets.KLEREK_KEYSTORE_BASE64 }}
          KLEREK_KEYSTORE_PASSWORD: ${{ secrets.KLEREK_KEYSTORE_PASSWORD }}
          KLEREK_KEY_ALIAS: ${{ secrets.KLEREK_KEY_ALIAS }}
          KLEREK_KEY_PASSWORD: ${{ secrets.KLEREK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KLEREK_KEYSTORE_BASE64" || { echo 'Keystore secret belum ada'; exit 1; }
          test -n "$KLEREK_KEYSTORE_PASSWORD" || { echo 'Password keystore belum ada'; exit 1; }
          test -n "$KLEREK_KEY_ALIAS" || { echo 'Alias keystore belum ada'; exit 1; }
          test -n "$KLEREK_KEY_PASSWORD" || { echo 'Password key belum ada'; exit 1; }
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore release keystore for this build only
        shell: bash
        env:
          KLEREK_KEYSTORE_BASE64: ${{ secrets.KLEREK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KLEREK_KEYSTORE_BASE64" | base64 --decode > android/app/klerek-release.jks
          test -s android/app/klerek-release.jks
      - name: Build signed APK Release
        env:
          KLEREK_KEYSTORE_PATH: klerek-release.jks
          KLEREK_KEYSTORE_PASSWORD: ${{ secrets.KLEREK_KEYSTORE_PASSWORD }}
          KLEREK_KEY_ALIAS: ${{ secrets.KLEREK_KEY_ALIAS }}
          KLEREK_KEY_PASSWORD: ${{ secrets.KLEREK_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android :app:assembleRelease --stacktrace
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          mkdir -p release
          cp "$APK" release/KLEREK-KASIR.apk
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KLEREK-KASIR-SIGNED-RELEASE
          path: release/KLEREK-KASIR.apk
          if-no-files-found: error
      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/KLEREK-KASIR.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
