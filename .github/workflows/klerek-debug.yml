name: KLEREK KASIR - Auto Build APK Debug

on:
  push:
    branches: [main]
    paths:
      - 'KLEREK_KASIR_ANDROID_SOURCE.zip'
      - '.github/workflows/klerek-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klerek-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android Debug dari ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test dan ekstrak paket Android
        shell: bash
        run: |
          set -euo pipefail
          test -s KLEREK_KASIR_ANDROID_SOURCE.zip
          unzip -t KLEREK_KASIR_ANDROID_SOURCE.zip | tail -1
          unzip -q -o KLEREK_KASIR_ANDROID_SOURCE.zip -d "$GITHUB_WORKSPACE"
          test -f android/app/src/main/assets/web/schedule-import.js
          test -f android/app/src/main/assets/web/update-config.json
          test -f android/app/src/main/assets/web/index.html
      - name: Setup Node 22 untuk uji jadwal
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Uji pembaca roster dan sintaks JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check android/app/src/main/assets/web/schedule-import.js
          node android/tests/roster-rules.test.js
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK Debug
        run: gradle --no-daemon -p android :app:assembleDebug --stacktrace
      - name: Check APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLEREK-KASIR-APK-DEBUG-v4.5.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
